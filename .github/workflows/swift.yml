name: Swift

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/swift.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/swift.yml'

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26, ubuntu-22.04, ubuntu-24.04]

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
